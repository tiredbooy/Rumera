root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ./cmd/server/main.go"
  delay = 1000                # ms to wait before rebuild after a change
  exclude_dir = [
    "assets", "tmp", "vendor",
    "migrations", "testdata",
    ".git", "docs"
  ]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true    # skip rebuild if nothing actually changed
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false                # use fsnotify (inotify inside Docker on Linux)
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true       # graceful SIGINT before SIGKILL
  stop_on_error = false       # keep watching even if build fails

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = true        # remove tmp/main on Air exit

[proxy]
  app_port = 8080
  enabled = false
  proxy_port = 8090

[screen]
  clear_on_rebuild = true
  keep_scroll = true