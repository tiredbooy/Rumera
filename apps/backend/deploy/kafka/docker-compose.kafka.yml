# Redpanda (Kafka-compatible) for local notification development.
# From this directory:
#   docker compose -f docker-compose.kafka.yml up -d
#
# Brokers for host processes: localhost:9092
# Console UI: http://localhost:8085  (optional)
name: rumera-kafka

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: rumera_redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy.*true'"]
      interval: 15s
      timeout: 10s
      retries: 8

  init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: rumera_kafka_init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create rumera.notification.otp.v1 -p 3 -r 1 --brokers redpanda:9092 || true
        rpk topic create rumera.notification.email.v1 -p 3 -r 1 --brokers redpanda:9092 || true
        rpk topic create rumera.notification.otp.v1.dlq -p 1 -r 1 --brokers redpanda:9092 || true
        rpk topic create rumera.notification.email.v1.dlq -p 1 -r 1 --brokers redpanda:9092 || true
        echo "topics ready"

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: rumera_redpanda_console
    depends_on:
      - redpanda
    ports:
      - "8085:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
