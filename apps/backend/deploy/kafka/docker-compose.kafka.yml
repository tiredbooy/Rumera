# Redpanda (Kafka-compatible) for local notification + domain-event development.
# From this directory:
#   docker compose -f docker-compose.kafka.yml up -d
#
# Brokers for HOST processes:      localhost:19092   (the published port)
# Brokers for CONTAINER processes: redpanda:9092     (internal listener)
# Console UI: http://localhost:8085  (optional)
#
# ── Reaching this broker from the app containers ─────────────────────────────
# This is a SEPARATE compose project, so by default it sits on its own network
# and the backend container cannot resolve `redpanda` at all. Two options:
#
#   1. Backend on the host (`go run ./cmd/server`): nothing to do — use
#      KAFKA_BROKERS=localhost:19092.
#
#   2. Backend in compose: bring the app stack up FIRST, then start this stack
#      with KAFKA_NETWORK set to that stack's network so the two join up:
#
#        docker compose -f ../../../../docker-compose.dev.yml up -d
#        KAFKA_NETWORK=rumera-dev_rumera_network \
#          docker compose -f docker-compose.kafka.yml up -d
#
#      (production project prefix is `rumera`, so `rumera_rumera_network`)
#      Then set KAFKA_BROKERS=redpanda:9092 on the backend service.
#
# None of this is needed for EVENTS_BUS=postgres, which is the default.
name: rumera-kafka

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: rumera_redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy.*true'"]
      interval: 15s
      timeout: 10s
      retries: 8

  init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: rumera_kafka_init
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    environment:
      KAFKA_BROKERS: redpanda:9092

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: rumera_redpanda_console
    depends_on:
      - redpanda
    ports:
      - "8085:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

# Default network. Override KAFKA_NETWORK to an already-running app stack's
# network (see the header) so backend containers can reach the broker; leave it
# unset for host-run processes, which use localhost:19092.
networks:
  default:
    name: ${KAFKA_NETWORK:-rumera-kafka_default}
