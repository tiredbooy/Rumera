name: CI

# The reliability gate the audit found missing: nothing previously ran the
# money/auth integration tests, the race detector, the linters, or the frontend
# type/build checks — they only ran if a human remembered `make`. This workflow
# enforces them on every push and PR to the integration branches.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · build · vet · lint · test(-race) · integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rumera_test
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the steps run.
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration harness (tests/integration) self-migrates via the goose
      # library and runs only when this is set; otherwise it skips cleanly.
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/rumera_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: apps/backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/backend

      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...

      - name: Integration tests (order/payment atomicity, coupon race, fail-closed limiter)
        run: make test-integration

  frontend:
    name: Frontend · lint · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Build-time placeholders so a clean CI checkout (no .env) builds; real
          # values are injected at deploy time, not baked into the image.
          AUTH_SECRET: ci-build-placeholder-secret-not-used-at-runtime
          API_URL: http://backend:8080/api/v1
          BACKEND_INTERNAL_URL: http://backend:8080
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
