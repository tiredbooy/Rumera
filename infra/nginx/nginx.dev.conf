# ──────────────────────────────────────────────────────────────────────────────
# Rumera — DEVELOPMENT reverse proxy / unified gateway.
#
# One origin (http://localhost) in front of the whole dev stack:
#   /api/v1/*  → Go backend  (backend:8080)
#   /*         → Next.js dev (frontend:3000)  +  HMR / Fast Refresh WebSocket
#
# CRITICAL for live-reload: Next.js (Turbopack/webpack) Fast Refresh runs over a
# WebSocket. The `Upgrade` / `Connection` headers below are what keep HMR alive
# through the proxy — without them the page loads but never hot-reloads.
#
# Mounted at /etc/nginx/conf.d/default.conf (http context) by docker-compose.dev.yml.
# ──────────────────────────────────────────────────────────────────────────────

# Toggles the Connection header between "upgrade" (WebSocket) and "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name _;

    # Resolve upstreams via Docker's embedded DNS at request time, so nginx
    # boots even if a service is briefly down and picks up new container IPs
    # after a rebuild/restart (with static names nginx caches the first IP).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Be generous in dev: large uploads, slow requests, big HMR payloads.
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Cheap liveness endpoint for the container healthcheck (no upstream needed).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Backend API ──────────────────────────────────────────────────────────
    # ONLY /api/v1/* is the Go backend. /api/auth/* (next-auth) and /api/public/*
    # are Next.js route handlers, so they must fall through to the frontend.
    location /api/v1/ {
        set $backend http://backend:8080;
        proxy_pass $backend;          # variable form preserves the full URI
        proxy_read_timeout 300s;
    }

    # ── Frontend + Hot Module Replacement ──────────────────────────────────────
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;         # covers /_next/webpack-hmr (the HMR socket)

        # WebSocket upgrade — REQUIRED for Fast Refresh / live reload.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Push changes straight through; keep the HMR socket open indefinitely.
        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
