# ──────────────────────────────────────────────────────────────────────────────
# Rumera — PRODUCTION reverse proxy / unified gateway.
#
# Single public origin in front of the stack:
#   /api/v1/*  → Go backend  (backend:8080)
#   /*         → Next.js     (frontend:3000)
#
# This is the "TLS-terminating reverse proxy" the prod compose file expects in
# front of frontend/backend. HTTP (:80) is wired up below; to terminate TLS,
# uncomment the 443 server block, mount your certs, and publish 443 in compose.
#
# Mounted at /etc/nginx/conf.d/default.conf (http context) by docker-compose.prod.yml.
# ──────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip               on;
gzip_vary          on;
gzip_proxied       any;
gzip_comp_level    5;
gzip_min_length    1024;
gzip_types         text/plain text/css application/json application/javascript
                   application/xml application/rss+xml image/svg+xml font/woff2;

# Hide version on the Server header and generated error pages (PR-090l).
server_tokens off;

# Edge backstop for unauthenticated auth/OTP. 10m ≈ 160k IPv4 keys.
# Backend LoginRateLimit (10/min) still owns the real counters.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

server {
    listen      80;
    server_name _;

    # Resolve service names via Docker's embedded DNS at request time so a
    # backend/frontend redeploy (new container IP) doesn't strand nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Reset XFF to the TCP peer only. $proxy_add_x_forwarded_for would append
    # a caller-supplied header and, with a trusted hop, let attackers pick
    # c.ClientIP() — spoofing login/OTP/global rate limits.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # /api/v1 and /media bypass Next headers(); apply the same conservative set
    # at the edge. No HSTS while this block is HTTP-only. No CSP (X-Frame-Options).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    limit_req_status 429;

    # Container healthcheck target (no upstream dependency).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Auth / OTP (more specific than /api/v1/ and /) ────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }

    location /api/public/auth/ {
        limit_req zone=auth burst=20 nodelay;
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }

    # ── Backend API (only /api/v1/* — Next.js owns the rest of /api/*) ─────────
    location /api/v1/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }

    # ── Optimized media (Go backend on-the-fly image transforms) ───────────────
    location /media/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }

    # ── Frontend storefront ────────────────────────────────────────────────────
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;

        # Support any server-sent / WebSocket traffic from the app.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

