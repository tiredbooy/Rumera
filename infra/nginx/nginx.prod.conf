# ──────────────────────────────────────────────────────────────────────────────
# Rumera — PRODUCTION reverse proxy / unified gateway.
#
# Single public origin in front of the stack:
#   /api/v1/*  → Go backend  (backend:8080)
#   /*         → Next.js     (frontend:3000)
#
# This is the "TLS-terminating reverse proxy" the prod compose file expects in
# front of frontend/backend. HTTP (:80) is wired up below; to terminate TLS,
# uncomment the 443 server block, mount your certs, and publish 443 in compose.
#
# Mounted at /etc/nginx/conf.d/default.conf (http context) by docker-compose.prod.yml.
# ──────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

gzip               on;
gzip_vary          on;
gzip_proxied       any;
gzip_comp_level    5;
gzip_min_length    1024;
gzip_types         text/plain text/css application/json application/javascript
                   application/xml application/rss+xml image/svg+xml font/woff2;

server {
    listen      80;
    server_name _;

    # Resolve service names via Docker's embedded DNS at request time so a
    # backend/frontend redeploy (new container IP) doesn't strand nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Container healthcheck target (no upstream dependency).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Backend API (only /api/v1/* — Next.js owns the rest of /api/*) ─────────
    location /api/v1/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }

    # ── Frontend storefront ────────────────────────────────────────────────────
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;

        # Support any server-sent / WebSocket traffic from the app.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

