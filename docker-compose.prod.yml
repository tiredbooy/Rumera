# ──────────────────────────────────────────────────────────────────────────────
# Rumera — PRODUCTION stack (optimized, hardened)
#
#   docker compose -f docker-compose.prod.yml up -d --build      # start
#   docker compose -f docker-compose.prod.yml logs -f backend    # tail
#   docker compose -f docker-compose.prod.yml down               # stop
#
# Differences from dev:
#   • Multi-stage, minimal, non-root images (no source, no toolchain).
#   • Databases are NOT published to the host — reachable only on the internal
#     network. Put a TLS-terminating reverse proxy in front of frontend/backend.
#   • Secrets are required: the stack refuses to start if they're unset.
#   • Pinned restart policy, log rotation, healthcheck-gated dependencies and
#     modest resource limits for predictable behaviour under load.
#
# Provide configuration via a .env file next to this one (see .env.example).
# ──────────────────────────────────────────────────────────────────────────────
name: rumera

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &restart-policy
  restart: unless-stopped

# Shared by the API and the event worker: both run the same image and the same
# wired dependency graph, so their configuration must not drift. The worker
# overrides only EVENTS_WORKER.
x-backend-env: &backend-env
  ENV: production
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set the storefront origin(s)}
  PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
  # Trust only the compose bridge (nginx → backend). Docker user-defined
  # networks come from 172.16.0.0/12. Do not use 0.0.0.0/0 — that re-opens
  # XFF spoofing of login/OTP/global rate limits. Combined with nginx
  # resetting X-Forwarded-For to $remote_addr, ClientIP is the TCP peer
  # at the gateway, not a caller-supplied header.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}

  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  DB_SSL_MODE: ${DB_SSL_MODE:-disable}

  ANALYTICS_DB_HOST: analytics_db
  ANALYTICS_DB_PORT: "5432"
  ANALYTICS_DB_USER: ${ANALYTICS_DB_USER}
  ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
  ANALYTICS_DB_NAME: ${ANALYTICS_DB_NAME}
  ANALYTICS_DB_SSL_MODE: ${ANALYTICS_DB_SSL_MODE:-disable}

  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB: "0"

  MEILI_HOST: http://meilisearch:7700
  MEILI_API_KEY: ${MEILI_API_KEY}

  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-10080}

  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  # Media (product images): originals + rendered cache on a persistent volume.
  MEDIA_ROOT: /data/media
  MEDIA_CACHE_DIR: /data/media-cache
  MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-15}
  MEDIA_DEFAULT_QUALITY: ${MEDIA_DEFAULT_QUALITY:-80}
  MEDIA_MAX_DIMENSION: ${MEDIA_MAX_DIMENSION:-4000}
  MEDIA_MAX_SOURCE_DIMENSION: ${MEDIA_MAX_SOURCE_DIMENSION:-12000}
  MEDIA_MAX_SOURCE_PIXELS: ${MEDIA_MAX_SOURCE_PIXELS:-40000000}

  # ── Domain events (transactional outbox) ─────────────────────────────
  # EVENTS_ENABLED=false is the emergency lever: producers stop enqueuing
  # and the legacy in-request side effects take over. It only works if the
  # value actually reaches the container, which is why these are here.
  # Defaults mirror configs/config.go — an EMPTY value is not "unset" to
  # envconfig, it is a parse error, so every typed var needs a real default.
  #
  # EVENTS_WORKER=external: the api replicas only emit, the event-worker
  # service below runs the consumers. Set it to "embedded" AND scale
  # event-worker to 0 if you want the single-process setup instead —
  # running both means two processes competing for the same outbox rows.
  EVENTS_ENABLED: ${EVENTS_ENABLED:-true}
  EVENTS_BUS: ${EVENTS_BUS:-postgres}
  EVENTS_WORKER: ${EVENTS_WORKER:-external}
  EVENTS_CONSUMER_GROUP: ${EVENTS_CONSUMER_GROUP:-rumera-event-worker}
  EVENTS_CONCURRENCY: ${EVENTS_CONCURRENCY:-4}
  EVENTS_MAX_ATTEMPTS: ${EVENTS_MAX_ATTEMPTS:-8}
  EVENTS_BACKOFF_BASE: ${EVENTS_BACKOFF_BASE:-2s}
  EVENTS_BACKOFF_MAX: ${EVENTS_BACKOFF_MAX:-1h}
  EVENTS_RETENTION: ${EVENTS_RETENTION:-720h}
  EVENTS_FALLBACK_AFTER: ${EVENTS_FALLBACK_AFTER:-5m}

  # ── Notifications / Kafka ────────────────────────────────────────────
  # Empty KAFKA_BROKERS is valid (it is a slice) and is what keeps the
  # postgres bus working with no broker deployed. Set it to redpanda:9092
  # after bringing up apps/backend/deploy/kafka/docker-compose.kafka.prod.yml.
  NOTIFICATIONS_MODE: ${NOTIFICATIONS_MODE:-inline}
  KAFKA_BROKERS: ${KAFKA_BROKERS:-}
  NOTIFICATION_WORKER_GROUP: ${NOTIFICATION_WORKER_GROUP:-rumera-notification-worker}
  KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
  KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME:-}
  KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD:-}
  KAFKA_TLS_ENABLED: ${KAFKA_TLS_ENABLED:-false}

services:
  # ── Main database ──────────────────────────────────────────────────────────
  postgres:
    <<: *restart-policy
    image: timescale/timescaledb:2.19.3-pg17
    logging: *default-logging
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [rumera_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  # ── Analytics database ─────────────────────────────────────────────────────
  analytics_db:
    <<: *restart-policy
    image: timescale/timescaledb:2.19.3-pg17
    logging: *default-logging
    environment:
      POSTGRES_USER: ${ANALYTICS_DB_USER:?ANALYTICS_DB_USER is required}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?ANALYTICS_DB_PASSWORD is required}
      POSTGRES_DB: ${ANALYTICS_DB_NAME:?ANALYTICS_DB_NAME is required}
    volumes:
      - analytics_data:/var/lib/postgresql/data
    networks: [rumera_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER} -d ${ANALYTICS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  # ── Cache ──────────────────────────────────────────────────────────────────
  redis:
    <<: *restart-policy
    image: redis:8.2-alpine
    logging: *default-logging
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis_data:/data
    networks: [rumera_network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 384m }

  # ── Search ─────────────────────────────────────────────────────────────────
  meilisearch:
    <<: *restart-policy
    image: getmeili/meilisearch:v1.15
    logging: *default-logging
    environment:
      MEILI_MASTER_KEY: ${MEILI_API_KEY:?MEILI_API_KEY is required}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    networks: [rumera_network]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    <<: *restart-policy
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: rumera/backend:latest
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
      analytics_db: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    environment: *backend-env
    # Bind to loopback by default — front this with a reverse proxy / TLS.
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - media_data:/data
    networks: [rumera_network]
    stop_grace_period: 30s
    # Readiness, not liveness: dependents must wait until both Postgres
    # pools answer. The image HEALTHCHECK stays on cheap GET /health.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2", memory: 512m }
        reservations: { cpus: "0.25", memory: 128m }

  # ── Domain-event worker ────────────────────────────────────────────────────
  # Runs the outbox fan-out/consume loops (plus the relay and the supervised
  # ingest consumer on EVENTS_BUS=kafka) for the whole stack. Same image as the
  # backend, different entrypoint: no HTTP server, no cron, no admin seeding.
  # Single instance — do not scale it and the API's embedded worker together.
  event-worker:
    <<: *restart-policy
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: rumera/backend:latest
    entrypoint: ["./event-worker"]
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
      analytics_db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *backend-env
      # Not inherited from the env var: this process claims the worker itself
      # (bootstrap.NewEventWorker). Pinned so the value is never ambiguous when
      # someone flips EVENTS_WORKER back to embedded for the API.
      EVENTS_WORKER: external
    volumes:
      # The wired graph opens the media stores at boot, so /data must exist and
      # be writable here too — same volume as the API.
      - media_data:/data
    networks: [rumera_network]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1", memory: 384m }
        reservations: { cpus: "0.1", memory: 64m }

  # ── Frontend storefront ────────────────────────────────────────────────────
  frontend:
    <<: *restart-policy
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
    image: rumera/frontend:latest
    logging: *default-logging
    depends_on:
      backend: { condition: service_healthy }
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      # Auth.js cannot sign sessions without these (dev compose already sets them).
      # Compose does not pass host .env keys unless listed here.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      # Server→API stays on the internal network; both vars point at the backend
      # service (data fetchers read API_URL, next-auth reads BACKEND_INTERNAL_URL).
      API_URL: http://backend:8080
      BACKEND_INTERNAL_URL: http://backend:8080
      # The separately deployed observability stack joins rumera_network.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      NEXT_PUBLIC_GRAFANA_URL: ${NEXT_PUBLIC_GRAFANA_URL:-http://localhost:3001}
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    networks: [rumera_network]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
        reservations: { cpus: "0.25", memory: 128m }

  # ── Reverse proxy / TLS-terminating gateway ──────────────────────────────────
  # Single public entry point:  /api/v1/* → backend, /* → frontend.
  # For HTTPS: mount certs (volume below), publish 443, and enable the 443
  # server block in infra/nginx/nginx.prod.conf.
  nginx:
    <<: *restart-policy
    image: nginx:1.27-alpine
    logging: *default-logging
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
    ports:
      - "${GATEWAY_PORT:-80}:80"
      # - "443:443"   # enable after mounting certs + the 443 block in the conf
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./infra/nginx/certs:/etc/nginx/certs:ro   # mount your TLS certs here
    networks: [rumera_network]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: 128m }
        reservations: { cpus: "0.1", memory: 32m }

volumes:
  postgres_data:
  analytics_data:
  redis_data:
  meili_data:
  media_data:

networks:
  rumera_network:
    driver: bridge
